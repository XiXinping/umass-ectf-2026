[package]
edition = "2024"
name = "ectf-2026"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false
default-run = "ectf-2026"

[lib]
harness = false
test = false

[[test]]
name = "pin_test"
harness = false

[[test]]
name = "rng_test"
harness = false

[[test]]
name = "gcm_test"
harness = false

[[test]]
name = "ecc_test"
harness = false

[[test]]
name = "secure_filesystem_test"
harness = false

[[test]]
name = "signature_test"
harness = false

[[bin]]
name = "ectf-2026"
test = false

[dependencies]
embassy-mspm0 = { git = "https://github.com/embassy-rs/embassy", version = "0.1.0", features = ["mspm0l2228pn", "defmt", "time-driver-any"] }
embassy-time = {git = "https://github.com/embassy-rs/embassy", version = "0.5.0", features = ["defmt"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { version = "0.7.0"}
defmt = "1.0.1"
defmt-rtt = "1.0.0"
rand_core = { version = "0.6.4", default-features = false}
rand_core_09 = { package = "rand_core", version = "0.9", default-features = false}
crypto = { version = "0.5.1", features = ["elliptic-curve", "digest"] }
pbkdf2 = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.8", default-features = false }
hex-literal = "1.1.0"
heapless = { version = "0.9.2", features = ["defmt", "zeroize", "serde"]}
hex = { version = "0.4", default-features = false }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
chacha20 = { version = "0.10.0" }
hkdf = "0.12.0"
uuid = { version = "1.23.0", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["heapless"]}
zerocopy = { version = "0.8.48", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
defmt-test = "0.4.0"
critical-section = "1.2.0"

[dev-dependencies]
defmt-test = "0.4.0"


[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
debug = 2

[profile.dev]
opt-level = "z"
debug = 2
debug-assertions = true
overflow-checks = true
lto = "thin"
codegen-units = 1
strip = false


[package.metadata.embassy]
build = [
  { target = "thumbv6m-none-eabi", artifact-dir = "out/examples/mspm0l2228" }
]
