[package]
edition = "2024"
name = "ectf-2026"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false
default-run = "ectf-2026"

[lib]
harness = false
test = false

[[test]]
name = "pin_test"
harness = false

[[test]]
name = "rng_test"
harness = false

[[test]]
name = "gcm_test"
harness = false

[[test]]
name = "ecc_test"
harness = false

[[bin]]
name = "ectf-2026"
test = false

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-mspm0 = { git = "https://github.com/embassy-rs/embassy", version = "0.1.0", features = ["mspm0l2228pn", "defmt", "time-driver-any"] }
embassy-time = {git = "https://github.com/embassy-rs/embassy", version = "0.5.0", features = ["defmt"] }
panic-halt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { version = "0.7.0"}
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-semihosting = "0.6.0"
rand_core = { version = "0.6.4", default-features = false}
rand_core_09 = { package = "rand_core", version = "0.9", default-features = false}
# Pin: fixed 1.30.0 (edition 2024) causes rustc ICE on thumbv6m
fixed = "=1.29.0"
crypto = { version = "0.5.1", features = ["elliptic-curve", "digest"] }
elliptic-curve = { version = "0.13.8", features = ["sec1"] }
pbkdf2 = { version = "0.12", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.8", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "heapless"] }
getrandom = { version = "0.2", features = ["custom"] }
embedded-test = { version = "0.7.1", features = ["defmt"] }
hex-literal = "1.1.0"
heapless = { version = "0.9.2", features = ["defmt", "zeroize"]}
hex = { version = "0.4", default-features = false }
x25519-dalek = {version = "2.0.1", default-features = false, features = ["static_secrets"]}
chacha20 = { version = "0.10.0" }
hkdf = "0.12.0"
uuid = { version = "1.23.0", default-features = false }


[profile.release]
debug = 2

[package.metadata.embassy]
build = [
  { target = "thumbv6m-none-eabi", artifact-dir = "out/examples/mspm0l2228" }
]
