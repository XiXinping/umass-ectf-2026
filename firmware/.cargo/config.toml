[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# replace MSPM0L2228 with your chip as listed in `probe-rs chip list`
runner = "probe-rs run --restore-unwritten --verify --chip MSPM0L2228 --protocol=swd"
rustflags = [
	"-C",
	"link-arg=-Tlink.x",
	"-C",
	"link-arg=-Tdevice.x",
	"-C",
	"link-arg=-Tdefmt.x",
	"-C",
	"link-arg=-Tinterrupt_group.x",
]

[build]
target = "thumbv6m-none-eabi"

[env]
DEFMT_LOG = "trace"
SECRETS_FILE = "global.secrets"
HSM_PIN = "abcdef"
PERMISSIONS = "1234=RW-:4321=-WC:dead=R--:beef=RWC"
